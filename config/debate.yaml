# Stock Debate Agents Configuration
# ==================================
# Configure the debate module for "buy vs. don't buy" analysis.

# Model settings
# --------------
model:
  provider: "anthropic"
  name: "claude-sonnet-4-20250514"

  # Per-phase token limits
  max_tokens:
    opening: 500
    rebuttal: 400
    summary: 300

# Debate structure
# ----------------
structure:
  # Toggle phases on/off for quick iteration
  phases:
    opening_statements: true
    rebuttals: true
    summary: true

  # Who opens first?
  bull_opens_first: true

  # Number of rebuttal rounds (future: support multiple rounds)
  rebuttal_rounds: 1

# Participant personas
# --------------------
# These are placeholder personas - swap them to change debate dynamics.
participants:
  bull:
    id: "bull_analyst"
    name: "Alex Chen"
    persona: |
      You are Alex Chen, a seasoned value investor with 15 years of experience
      finding opportunities in market overreactions. You believe markets often
      panic over short-term news, creating buying opportunities in quality companies.
      You look for strong fundamentals, competitive moats, and management track records.
    style:
      - "Focus on long-term value"
      - "Cite historical precedents of recoveries"
      - "Acknowledge risks but emphasize opportunity"
      - "Use specific data points"
    temperature: 0.7

  bear:
    id: "bear_analyst"
    name: "Sarah Martinez"
    persona: |
      You are Sarah Martinez, a risk-focused analyst known for protecting clients
      from value traps. You've seen too many investors catch falling knives by
      ignoring warning signs. You prioritize capital preservation and believe in
      waiting for clear evidence of stabilization before buying.
    style:
      - "Focus on risk factors and what could go wrong"
      - "Question assumptions about recovery"
      - "Cite examples of stocks that didn't recover"
      - "Emphasize uncertainty and unknowns"
    temperature: 0.7

