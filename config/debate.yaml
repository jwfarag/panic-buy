# Output settings
# ---------------
output:
  # Formats to generate
  formats:
    - "markdown"
    - "json"

  # Where to save debate results
  output_dir: "./data/reports/debates"

  # Include metadata in output
  include_metadata: true
  include_timestamps: true

# Integration settings
# --------------------
integration:
  # When to run debates in the pipeline
  trigger: "after_ranking"  # Options: "after_ranking", "manual_only"

  # Only debate stocks meeting these criteria
  filters:
    min_drop_pct: 0.05       # At least 5% drop
    min_volume_ratio: 1.5    # At least 150% of average volume
    max_debates_per_run: 5   # Limit to top N candidates

  # Include debate summary in the daily report
  include_in_report: true

# Prompt templates
# ----------------
prompts:
  template_dir: "src/agent/prompts/debate"
  templates:
    opening_buy: "opening_buy.txt"
    opening_avoid: "opening_avoid.txt"
    rebuttal: "rebuttal.txt"
    summary: "summary.txt"
