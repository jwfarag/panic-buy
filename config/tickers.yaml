# Panic Buy Detector - Ticker Universe
# =====================================
#
# This file defines the universe of "stable" companies to monitor.
# Stability criteria:
# - Large market cap (>$10B suggested)
# - Low beta (<1.5 suggested)
# - Consistent earnings history
# - Low debt/equity ratio
# - Established business model (not speculative growth)
#
# TODO: Implement automatic universe filtering based on these criteria
# TODO: Add sector ETF mappings for market correlation filtering

# Universe selection criteria (for future auto-filtering)
selection_criteria:
  min_market_cap_billions: 10
  max_beta: 1.5
  min_years_profitable: 5
  max_debt_to_equity: 1.0
  excluded_sectors:
    - "Biotechnology"          # Too binary (FDA approvals)
    - "Cryptocurrency"         # Too volatile
    - "SPACs"                  # Too speculative

