# Panic Buy Detector - Docker Compose
# ====================================
# Development and production deployment configuration.

version: '3.8'

services:
  # Main application
  panic-buy:
    build: .
    container_name: panic-buy
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      # TODO: Add API keys via environment or secrets
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped

  # Manual run (one-off)
  # Usage: docker-compose run --rm manual-run
  manual-run:
    build: .
    container_name: panic-buy-manual
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m src.pipeline.daily_run
    profiles:
      - manual

  # MLflow tracking server (optional)
  # mlflow:
  #   image: ghcr.io/mlflow/mlflow:v2.5.0
  #   container_name: mlflow
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - ./mlflow:/mlflow
  #   command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
  #   profiles:
  #     - mlflow

# Volumes for persistent data
volumes:
  data:
  models:
  logs:
